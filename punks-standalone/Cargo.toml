[package]
name = "punks-standalone"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
punks-browser = { path = "../crates/punks-browser" }
punks-ui = { path = "../crates/punks-ui" }
imgui = "0.12"
imgui-wgpu = "0.25"
imgui-winit-support = "0.13"
wgpu = "25.0"
winit = "0.30"
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
drag = "2"
arboard = { version = "3.6.1", default-features = false }
# Phase 3 Stage 1: the app owns the long-lived Painter and opens a frame per
# render pass (see main.rs). Normal dependency now — no longer just the
# painter_demo example's testbed. Shares one imgui-sys build with `imgui`.
imgui-painter = { path = "../imgui-painter/bindings/rust" }
