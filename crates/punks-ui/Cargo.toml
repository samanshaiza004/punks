[package]
name = "punks-ui"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
punks-core = { path = "../punks-core" }
punks-browser = { path = "../punks-browser" }
imgui = "0.12"
# Phase 3 Stage 1: normal dependency (not dev-only) — the waveform panel
# submits its background rect through imgui-painter's FramePainter. Pins the
# same imgui-sys "0.12" as `imgui` above, so both resolve to one shared build.
# imgui-painter moved to its own repo; pinned to a rev, not a branch, so a
# push there can't silently change what punks2 builds against.
imgui-painter = { git = "https://github.com/samanshaiza004/imgui-painter", rev = "1b3b001ae90daf6b4235615876e4ff85f6e309ed" }
rfd = "0.15"
log = "0.4"
