name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  drawing-boundary:
    name: drawing boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No raw ImDrawList geometry in application code
        # punks2 describes geometry through imgui-painter (Canvas); only text
        # (imgui owns the font atlas) may go straight to ImDrawList. A raw
        # fill/stroke in product code belongs in imgui-painter instead —
        # improve the library until it can express the shape, don't hand-roll
        # it here. Scoped to crates/: imgui-painter itself legitimately calls
        # PrimReserve/PrimWrite* and tessellates.
        run: |
          if grep -rnE '\.(add_rect|add_rect_filled|add_line|add_circle|add_circle_filled|add_triangle|add_triangle_filled|add_ngon|add_ngon_filled|add_bezier_cubic|add_bezier_quadratic|add_polyline|add_convex_poly_filled)\b|ImDrawList_Add(Rect|RectFilled|Line|Circle|CircleFilled|Triangle|TriangleFilled|Ngon|NgonFilled|Polyline|ConvexPolyFilled|BezierCubic|BezierQuadratic)' crates/ --include='*.rs'; then
            echo "::error::Raw ImDrawList geometry found in application code — draw it through imgui-painter (Canvas) instead. Only add_text may bypass it."
            exit 1
          fi
          echo "OK: application code constructs no raw geometry."

  imgui-painter-independent:
    name: imgui-painter independent build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The scratch copy has no lockfile, so the build resolves the newest
      # compatible imgui-sys. The final check turns the README's "Dependency
      # bump checklist" into an enforced gate: reconstructed widget-chrome
      # geometry (Checkbox box, InputText frame) is not a stable Dear ImGui
      # contract, so an imgui-sys bump can compile cleanly while silently
      # moving the stock widget away from the painted rectangle. CI fails
      # whenever the fresh resolution differs from the version a human last
      # verified with painter_demo — upstream point releases trip this too,
      # by design. To acknowledge a bump: run the checklist, then update
      # imgui-painter/VERIFIED_IMGUI_SYS.
      - name: Build outside the host workspace
        shell: bash
        run: |
          scratch="$(mktemp -d)"
          cp -R imgui-painter "$scratch/imgui-painter"
          cd "$scratch/imgui-painter/bindings/rust"
          cargo build --examples
          cargo test
          verified="$(tr -d '[:space:]' < ../../VERIFIED_IMGUI_SYS)"
          resolved="$(cargo pkgid imgui-sys | sed 's/.*[@#]//')"
          if [ "$resolved" != "$verified" ]; then
            echo "imgui-sys resolved to $resolved but the painter_demo visual gate"
            echo "was last verified against $verified."
            echo "Run the Dependency bump checklist in imgui-painter/README.md,"
            echo "then update imgui-painter/VERIFIED_IMGUI_SYS to $resolved."
            exit 1
          fi
          echo "imgui-sys $resolved matches the visually verified version."
