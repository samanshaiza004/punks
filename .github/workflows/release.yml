name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            ext: tar.gz
          - os: ubuntu-latest
            platform: linux
            ext: tar.gz
          - os: windows-latest
            platform: windows
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p punks-standalone

      # Version comes from the pushed tag (e.g. v0.2.0), not hardcoded, so
      # this stays correct for every future release without editing the
      # workflow again.
      - name: Set artifact name
        shell: bash
        run: echo "ARTIFACT=punks-standalone-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.ext }}" >> "$GITHUB_ENV"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -C target/release -czf "${{ env.ARTIFACT }}" punks-standalone

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/punks-standalone.exe -DestinationPath "${{ env.ARTIFACT }}"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}
